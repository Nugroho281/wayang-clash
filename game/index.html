<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayang Clash — Duel Kartu Dalang</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #171009; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #shot-ready { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Wayang Clash: duel kartu wayang — mainkan kartu ke tiga jalur, kurangi nyawa dalang lawan dari 20 ke 0"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<p id="shot-ready" aria-hidden="true"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
